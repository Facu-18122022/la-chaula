<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Chaula</title>
    
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/inicio.css">
    <link rel="stylesheet" href="css/ssf-theme.css">
    <link rel="stylesheet" href="css/arcade.css">
</head>
<body>
<!-- Rutas relativas: el juego también se abre como archivo (Batocera, sin servidor). -->
<script src="js/arcade/almacen.js"></script>
<script src="js/music.js"></script>

    <!-- Pantalla Inicio -->
    <section id="inicio" class="pantalla">
        <div class="overlay">
            <h1 class="ssf-title">La Chaula</h1>

            <div class="play-button-shell">
                <span class="football" aria-hidden="true">⚽</span>
                <button id="btnJugar" class="ssf-button ssf-button-primary" type="button" data-nav data-nav-inicial data-nav-sonido="start">
                    <span class="arcade-parpadeo">Presioná Start</span>
                </button>
            </div>

            <div class="arcade-marquesina" aria-live="polite">
                <p id="insertCoin" class="arcade-insert-coin">Insertá ficha</p>
                <p id="creditos" class="arcade-creditos">Free play</p>
            </div>
        </div>
    </section>

    <script src="js/arcade/controles.js"></script>
    <script src="js/arcade/sonidos.js"></script>
    <script src="js/arcade/navegacion.js"></script>
    <script src="js/inicio.js"></script>
</body>
</html>
