<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Chaula</title>
    
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/menu.css">
    <link rel="stylesheet" href="../css/ssf-theme.css">
</head>
<body>
<script src="../js/music.js"></script>

    <!-- ========================= -->
    <!-- MENU PRINCIPAL -->
    <!-- ========================= -->

    <main id="main-menu" class="view active">

        <div class="menu-grid">

           <button id="btnPlayLocal" class="menu-card menu-card--play ssf-card-primary ssf-button">
                <div class="menu-card__image"></div>

                <div class="menu-card__content">
                    <span class="menu-card__subtitle">
                        DOS JUGADORES
                    </span>

                    <h2 class="ssf-title">JUGAR LOCAL</h2>
                </div>

            </button>

            <div class="menu-card menu-card--art ssf-card" aria-hidden="true">
                <div class="menu-card__image"></div>
            </div>

           <button  id="btnSettings"  class="menu-card menu-card--settings ssf-card">

                <div class="menu-card__image"></div>

                <div class="menu-card__content">
                    <span class="menu-card__subtitle">
                        AJUSTES
                    </span>

                    <h2 class="ssf-title">CONFIGURACIÓN</h2>
                </div>

            </button>

            <button id="btnExit"  class="menu-card menu-card--exit ssf-card ssf-button-danger">

                <div class="menu-card__image"></div>

                <div class="menu-card__content">
                    <span class="menu-card__subtitle">
                        SISTEMA
                    </span>

                    <h2 class="ssf-title">SALIR</h2>
                    
                </div>

            </button>

        </div>

        <div class="logo-container">

        </div>

    </main>

    <script src="../js/theme-loader.js"></script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="../js/menu.js"></script>

</body>
</html>
