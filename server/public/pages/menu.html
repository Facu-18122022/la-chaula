<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Chaula</title>
    
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/retro-ui.css">
    <link rel="stylesheet" href="../css/menu.css">
    <link rel="stylesheet" href="../css/ssf-theme.css">
    <link rel="stylesheet" href="../css/arcade.css">
</head>
<body class="menu-page">
<script src="../js/music.js"></script>

    <!-- ========================= -->
    <!-- MENU PRINCIPAL -->
    <!-- ========================= -->

    <main id="main-menu" class="view active smash-ui-container">

        <div class="menu-grid">

           <button id="btnPlayLocal" class="menu-card smash-panel menu-card--play" type="button" data-nav data-nav-inicial data-nav-sonido="elegir">
                <div class="menu-card__image"></div>

                <div class="menu-card__content">
                    <span class="menu-card__subtitle">
                        DOS JUGADORES
                    </span>

                    <h2>JUGAR LOCAL</h2>
                </div>

            </button>

            <div class="menu-card menu-card--art" aria-hidden="true">
                <div class="menu-card__image"></div>
            </div>

           <button id="btnSettings" class="menu-card smash-panel menu-card--settings" type="button" data-nav>

                <div class="menu-card__image"></div>

                <div class="menu-card__content">
                    <span class="menu-card__subtitle">
                        AJUSTES
                    </span>

                    <h2>CONFIGURACIÓN</h2>
                </div>

            </button>

            <button id="btnExit" class="menu-card smash-panel menu-card--exit" type="button" data-nav>

                <div class="menu-card__image"></div>

                <div class="menu-card__content">
                    <span class="menu-card__subtitle">
                        SISTEMA
                    </span>

                    <h2>SALIR</h2>
                    
                </div>

            </button>

        </div>

        <p class="arcade-pie">▲▼◀▶ ELEGIR · PATEAR ACEPTA · SOLO JUGADOR 1</p>

    </main>

    <script src="../js/arcade/controles.js"></script>
    <script src="../js/arcade/sonidos.js"></script>
    <script src="../js/arcade/navegacion.js"></script>
    <script src="../js/menu.js"></script>

</body>
</html>
