<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Chaula | Partida local</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/crear-sala.css">
    <link rel="stylesheet" href="../css/ssf-theme.css">
    <link rel="stylesheet" href="../css/retro-ui.css">
    <link rel="stylesheet" href="../css/arcade.css">
</head>
<body>
    <main class="admin-page local-config">
        <header class="admin-header">
            <div class="logo-placeholder"></div>
        </header>

        <div class="header-info">
            <h1 class="ssf-title">PARTIDA LOCAL</h1>
            <p class="ssf-subtitle" title="Configurá la partida antes de comenzar">Configura la partida antes de comenzar</p>
        </div>

        <section class="admin-content">
            <article class="panel-card ssf-card-primary">
                <h2 class="ssf-subtitle" title="Configuración del partido">Configuracion del partido</h2>

                <div class="form-group" data-nav>
                    <label for="localMatchTime">Tiempo del partido</label>
                    <select id="localMatchTime">
                        <option value="3">3 minutos</option>
                        <option value="5" selected>5 minutos</option>
                        <option value="7">7 minutos</option>
                    </select>
                </div>

                <div class="form-group" data-nav>
                    <label for="localGoalLimit">Límite de goles</label>
                    <select id="localGoalLimit">
                        <option value="3">3 goles</option>
                        <option value="5" selected>5 goles</option>
                        <option value="10">10 goles</option>
                        <option value="null">Sin límite</option>
                    </select>
                </div>

                <div class="form-group" data-nav>
                    <label for="localPowerUps">Power-ups</label>
                    <select id="localPowerUps">
                        <option value="1" selected>Sí</option>
                        <option value="0">No (Futsal puro)</option>
                    </select>
                </div>

                <p id="localConfigMessage" role="alert" aria-live="polite"></p>
            </article>

            <article class="panel-card ssf-card">
                <h2 class="ssf-subtitle">Cancha</h2>

                <div class="map-carousel">
                    <button id="prevMap" class="map-arrow ssf-button" type="button" aria-label="Mapa anterior">◀</button>

                    <div class="map-preview" data-nav data-nav-izquierda="#prevMap" data-nav-derecha="#nextMap" data-nav-sonido="elegir">
                        <div class="map-image" id="mapInfo" aria-live="polite">
                            <canvas id="mapPreviewCanvas"></canvas>
                        </div>
                        <h3 id="mapName">Classic Arena (1v1)</h3>
                    </div>

                    <button id="nextMap" class="map-arrow ssf-button" type="button" aria-label="Mapa siguiente">▶</button>
                </div>
            </article>
        </section>

        <footer class="admin-footer">
            <button id="backButton" class="btn-secondary ssf-button ssf-button-danger" type="button" data-nav>Volver</button>
            <button id="startLocalMatch" class="btn-primary ssf-button" type="button" data-nav data-nav-inicial data-nav-sonido="elegir">Iniciar partido</button>
        </footer>
        <!-- Mayúsculas sin tilde: la fuente pixel dibuja mal Ó/Á (el texto correcto va en aria-label). -->
        <p class="arcade-pie" aria-label="Arriba y abajo: elegir opción. Izquierda y derecha: cambiar. Patear acepta. Atrás vuelve.">▲▼ ELEGIR OPCION · ◀▶ CAMBIAR · PATEAR ACEPTA · ATRAS VUELVE</p>
    </main>

    <script src="../js/arcade/almacen.js"></script>
    <script src="../js/music.js"></script>
    <script src="../js/arcade/controles.js"></script>
    <script src="../js/arcade/sonidos.js"></script>
    <script src="../js/arcade/navegacion.js"></script>
    <script src="../js/local/mapas.js"></script>
    <script src="../js/local/fisica-haxball.js"></script>
    <script src="../js/local-config.js"></script>
</body>
</html>
