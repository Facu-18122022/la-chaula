<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Chaula | Configuración</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/configuracion.css">
    <link rel="stylesheet" href="../css/ssf-theme.css">
</head>
<body>
<script src="/js/music.js"></script>

    <main class="settings-page ssf-text">

        <header class="settings-header">

            <div class="logo-placeholder"> </div>

 </header>
            <div class="header-info">

                <h1 class="ssf-title">CONFIGURACIÓN</h1>

                    <p class="ssf-subtitle">
                    Personalizá tu experiencia de juego
                </p>

            </div>

        <section class="settings-content">

            <!-- AUDIO -->

            <article class="settings-card ssf-card">

                <h2 class="ssf-subtitle">🔊 Audio</h2>

                <div class="setting-group">

                    <label>
                        Música
                    </label>

                    <input
                        type="range"
                        min="0"
                        max="100"
                        value="70"
                        id="musicVolume"
                        class="setting-input"
                    >

                </div>

                <div class="setting-group">

                    <label>
                        Efectos
                    </label>

                    <input
                        type="range"
                        min="0"
                        max="100"
                        value="80"
                        id="effectsVolume"
                        class="setting-input"
                    >

                </div>

                <div class="setting-group checkbox-group">

                    <input
                        type="checkbox"
                        id="muteAll"
                        class="setting-input"
                        role="switch"
                        aria-describedby="muteStatus"
                    >

                    <label for="muteAll" class="mute-toggle">
                        <span class="mute-toggle__icon" aria-hidden="true">🔇</span>
                        <span class="mute-toggle__copy">
                            <strong>Silenciar todo</strong>
                            <small id="muteStatus" aria-live="polite">Desactivado</small>
                        </span>
                        <span class="mute-toggle__track" aria-hidden="true">
                            <span class="mute-toggle__thumb"></span>
                        </span>
                    </label>

                </div>

            </article>

            <!-- VISUAL -->

            <article class="settings-card ssf-card-primary">

                <h2 class="ssf-subtitle">🎨 Apariencia</h2>

                <div class="setting-group">

                    <label>
                        Tema
                    </label>

                    <select
                        id="themeSelect"
                        class="setting-input">

                        <option value="dark">
                            Oscuro
                        </option>

                        <option value="light">
                            Claro
                        </option>

                        <option value="neon">
                            Neón
                        </option>

                    </select>

                </div>

                <div class="setting-group">

                    <label>
                        Animaciones
                    </label>

                    <select
                        id="animations"
                        class="setting-input">

                        <option value="on">
                            Activadas
                        </option>

                        <option value="off">
                            Desactivadas
                        </option>

                    </select>

                </div>

            </article>

        </section>

        <footer class="settings-footer">

            <button
                id="backButton"
                class="btn-secondary ssf-button ssf-button-danger">

                Volver

            </button>

            <button
                id="saveButton"
                class="btn-primary ssf-button"
                disabled>

                Guardar cambios

            </button>

        </footer>

    </main>

    <script src="../js/theme-loader.js"></script>
*     <script src="/socket.io/socket.io.js"></script>
    <script src="../js/configuracion.js"></script>
</body>
</html>
