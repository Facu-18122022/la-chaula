<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Chaula | Configuración</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/configuracion.css">
    <link rel="stylesheet" href="../css/ssf-theme.css">
    <link rel="stylesheet" href="../css/retro-ui.css">
    <link rel="stylesheet" href="../css/arcade.css">
</head>
<body>
<script src="/js/music.js"></script>

    <main class="settings-page ssf-text">

        <header class="settings-header">

            <div class="logo-placeholder"> </div>

 </header>
            <div class="header-info">

                <h1 class="ssf-title">CONFIGURACIÓN</h1>

                    <p class="ssf-subtitle">
                    Personalizá tu experiencia de juego
                </p>

            </div>

        <section class="settings-content">

            <!-- AUDIO -->

            <article class="settings-card ssf-card">

                <h2 class="ssf-subtitle">🔊 Audio</h2>

                <div class="setting-group" data-nav data-nav-inicial>

                    <label for="musicVolume">
                        Música
                    </label>

                    <input
                        type="range"
                        min="0"
                        max="100"
                        value="70"
                        id="musicVolume"
                        class="setting-input"
                    >

                </div>

                <div class="setting-group" data-nav>

                    <label for="effectsVolume">
                        Efectos
                    </label>

                    <input
                        type="range"
                        min="0"
                        max="100"
                        value="80"
                        id="effectsVolume"
                        class="setting-input"
                    >

                </div>

                <div class="setting-group checkbox-group" data-nav>

                    <input
                        type="checkbox"
                        id="muteAll"
                        class="setting-input"
                        role="switch"
                        aria-describedby="muteStatus"
                    >

                    <label for="muteAll" class="mute-toggle">
                        <span class="mute-toggle__icon" aria-hidden="true">🔇</span>
                        <span class="mute-toggle__copy">
                            <strong>Silenciar todo</strong>
                            <small id="muteStatus" aria-live="polite">Desactivado</small>
                        </span>
                        <span class="mute-toggle__track" aria-hidden="true">
                            <span class="mute-toggle__thumb"></span>
                        </span>
                    </label>

                </div>

            </article>

            <!-- CONTROLES -->

            <article class="settings-card ssf-card">

                <h2 class="ssf-subtitle">🕹️ Controles</h2>

                <p class="settings-note">
                    Probá el teclado o los joysticks, detectá teclas que se
                    bloquean (ghosting) y cambiá qué tecla o botón hace cada cosa.
                </p>

                <button
                    id="controlsButton"
                    class="btn-primary ssf-button"
                    type="button"
                    data-nav>

                    Probar y asignar controles

                </button>

            </article>

        </section>

        <footer class="settings-footer">

            <button
                id="backButton"
                class="btn-secondary ssf-button ssf-button-danger"
                type="button"
                data-nav>

                Volver

            </button>

            <button
                id="saveButton"
                class="btn-primary ssf-button"
                type="button"
                data-nav
                data-nav-sonido="elegir"
                disabled>

                Guardar cambios

            </button>

        </footer>

        <p id="saveStatus" class="arcade-aviso" role="status" aria-live="polite"></p>

    </main>

    <script src="../js/arcade/controles.js"></script>
    <script src="../js/arcade/sonidos.js"></script>
    <script src="../js/arcade/navegacion.js"></script>
    <script src="../js/configuracion.js"></script>
</body>
</html>
